name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Versionsnummern gleich?
        run: |
          v=$(node -p "require('./package.json').version")
          t=$(node -p "require('./src-tauri/tauri.conf.json').version")
          c=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$v tauri.conf.json=$t Cargo.toml=$c"
          test "$v" = "$t" && test "$v" = "$c"
          grep -q "^## $v " ../CHANGELOG.md || { echo "CHANGELOG.md hat keinen Eintrag für $v"; exit 1; }
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Abhängigkeiten
        working-directory: app
        run: npm ci
      - name: Desktop-App bauen (Tauri)
        working-directory: app
        run: npx tauri build
      - name: Dateien zusammenstellen
        id: files
        shell: pwsh
        run: |
          $v = node -p "require('./app/package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem app\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out\Chromalith-$v-Setup.exe"
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item app\src-tauri\target\release\chromalith.exe portable\Chromalith.exe
          Compress-Archive -Path portable\* -DestinationPath out\Chromalith-windows.zip
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: Chromalith-windows
          path: out/*
      - name: Neues Release nötig?
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.files.outputs.version }}"
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "release=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v gibt es schon" }
          else { "release=true" >> $env:GITHUB_OUTPUT; Write-Host "Neues Release v$v" }
          exit 0
      - name: Release Notes aus CHANGELOG.md
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.files.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $out = @(); $on = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') { if ($on) { break }; if ($l -match "^## $([regex]::Escape($ver))\b") { $on = $true; continue } }
            if ($on) { $out += $l }
          }
          if (-not $out) { Write-Error "Kein Eintrag für $ver in CHANGELOG.md"; exit 1 }
          $out | Out-File -Encoding utf8NoBOM release_notes.md
          Get-Content release_notes.md
      - name: Release anlegen (Tag v<Version>)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.files.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Chromalith v${{ steps.files.outputs.version }}
          body_path: release_notes.md
          files: out/*

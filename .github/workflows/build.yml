name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Exe bauen
        run: pyinstaller --noconfirm chromalith.spec
      - name: Kurztest der Exe (Kommandozeile)
        shell: pwsh
        run: |
          python -c "from PIL import Image; import numpy as np; Image.fromarray((np.tile(np.linspace(0,255,64),(32,1))).astype('uint8')).save('t.png')"
          dist\Chromalith\Chromalith-CLI.exe t.png --width 20 -o out\t
          if (!(Test-Path out\t.stl)) { exit 1 }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Chromalith\* -DestinationPath Chromalith-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Chromalith-windows
          path: Chromalith-windows.zip
      - name: Version ermitteln – neues Release nötig?
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import chromalith; print(chromalith.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "release=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v gibt es schon" }
          else { "release=true" >> $env:GITHUB_OUTPUT; Write-Host "Neues Release v$v" }
          exit 0
      - name: Release Notes aus CHANGELOG.md
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $out = @(); $on = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') { if ($on) { break }; if ($l -match "^## $([regex]::Escape($ver))\b") { $on = $true; continue } }
            if ($on) { $out += $l }
          }
          if (-not $out) { Write-Error "Kein Eintrag für $ver in CHANGELOG.md"; exit 1 }
          $out | Out-File -Encoding utf8NoBOM release_notes.md
          Get-Content release_notes.md
      - name: Release anlegen (Tag v<Version>)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Chromalith v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: Chromalith-windows.zip

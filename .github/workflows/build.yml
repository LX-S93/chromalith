name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Exe bauen
        run: pyinstaller --noconfirm chromalith.spec
      - name: Kurztest der Exe (Kommandozeile)
        shell: pwsh
        run: |
          python -c "from PIL import Image; import numpy as np; Image.fromarray((np.tile(np.linspace(0,255,64),(32,1))).astype('uint8')).save('t.png')"
          dist\Chromalith\Chromalith-CLI.exe t.png --width 20 -o out\t
          if (!(Test-Path out\t.stl)) { exit 1 }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Chromalith\* -DestinationPath Chromalith-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Chromalith-windows
          path: Chromalith-windows.zip
      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chromalith-windows.zip

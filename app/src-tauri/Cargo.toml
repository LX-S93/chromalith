[package]
name = "chromalith"
version = "0.14.0"
description = "Chromalith – farbige Reliefbilder aus Filament-Schichten"
edition = "2021"

[lib]
name = "chromalith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
